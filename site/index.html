<script>
// apply saved theme before first paint — prevents the dark/light flash
(function(){try{
  var t=localStorage.getItem('cn_theme');
  if(!t) t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>

<script>
// Theme toggle — persisted in localStorage
(function() {
  const saved = localStorage.getItem('cn_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    function updateIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.textContent = isDark ? '🌙' : '☀️';
      btn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    }
    updateIcon();
    const bgBtn = document.getElementById('bgToggle');
    function updateBg() {
      const on = localStorage.getItem('cn_bg3d') !== 'off';
      bgBtn.textContent = on ? '✨' : '⬜';
      bgBtn.title = on ? 'Hide animated 3D backgrounds (saves battery)' : 'Show animated 3D backgrounds';
    }
    bgBtn.addEventListener('click', function() {
      if (window.BG3D) window.BG3D.toggle();
      updateBg();
    });
    updateBg();
    btn.addEventListener('click', function() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cn_theme', next);
      updateIcon();
    });
  });
})();
</script>
